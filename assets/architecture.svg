<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" aria-labelledby="t d" role="img" viewBox="0 0 1120 660"><title id="t">How kevala works</title><desc id="d">Pinned Laya and Kev-0.8B checkpoints convert in the browser; larger models use native conversion. Refreshed Kev, H2O-Lightning, and Clef-flash default to BF16, with Q8 optional. Packs are kept in browser storage. A dependency-free Rust core compiled to WebAssembly runs the decision models on WebGPU or compatible CPU backends, and your page gets typed answers with probabilities.</desc><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#7aa2ff"/><stop offset=".55" stop-color="#45e0c0"/><stop offset="1" stop-color="#c592ff"/></linearGradient><linearGradient id="gv" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#7aa2ff"/><stop offset="1" stop-color="#45e0c0"/></linearGradient><marker id="a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#45e0c0" d="M0 0L10 5L0 10z"/></marker><style>.bg{fill:#07090d}.box,.box2{fill:#0f131b;stroke:#2c3749;stroke-width:1.2}.box2{fill:#141925}.hl{fill:#0f131b;stroke:url(#g);stroke-width:1.6}.t,.t2{font:700 15px ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif;fill:#e7ecf3}.t2{font:700 13px ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif}.s{font:12px ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif;fill:#8591a5}.m{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#b8c2d1}.k{font:700 10.5px ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif;letter-spacing:1.6px;fill:#45e0c0}.arrow{stroke:#45e0c0;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:5 5}.lbl{font:600 11px ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif;fill:#45e0c0}</style></defs><rect width="1120" height="660" class="bg" rx="18"/><text x="34" y="40" class="k">WEIGHTS</text><rect width="318" height="112" x="30" y="54" class="box" rx="12"/><text x="50" y="84" class="t">Hugging Face, pinned revisions</text><text x="50" y="110" class="m">convaiinnovations/laya</text><text x="50" y="130" class="m">jaredpalmer/kev-0.8b</text><text x="50" y="150" class="m">Qwen/Qwen3.5-0.8B-Base</text><path d="M352 110 H 396" class="arrow"/><text x="356" y="100" class="lbl">stream</text><rect width="318" height="112" x="400" y="54" class="box" rx="12"/><text x="420" y="84" class="t">In-browser converter</text><text x="420" y="108" class="s">Weights stream through, never held twice.</text><text x="420" y="128" class="s">BF16 by default for Kev; Q8 optional.</text><text x="420" y="146" class="s">Q8 scales, norms and heads remain f32.</text><path d="M722 110 H 766" class="arrow"/><rect width="320" height="112" x="770" y="54" class="hl" rx="12"/><text x="790" y="84" class="t">.kevala pack</text><text x="790" y="108" class="s">Laya 479 MB Q8 · Kev-0.8B 1.51 GB BF16</text><text x="790" y="128" class="s">Stored in the browser (OPFS) after first load,</text><text x="790" y="146" class="s">or self-hosted: <tspan class="m">kevala convert</tspan></text><path d="M930 170 V 204" class="arrow"/><text x="34" y="228" class="k">ENGINE</text><rect width="1060" height="196" x="30" y="208" class="hl" rx="14"/><text x="52" y="240" class="t">kevala core · Rust, zero dependencies, compiled to WebAssembly</text><text x="52" y="262" class="s">Tokenizers, batched requests, BF16/F32/Q8 matmul kernels and decision readouts. Compatible packs also run in Node.</text><rect width="494" height="106" x="52" y="280" class="box2" rx="11"/><text x="70" y="306" class="t2">Laya · encoder + decision head</text><text x="70" y="328" class="s">ModernBERT-large, 28 layers (local + global attention),</text><text x="70" y="346" class="s">then a 2-layer decision head over each question&apos;s markers.</text><text x="70" y="370" class="m">noul · choice · score + confidence, act</text><rect width="494" height="106" x="574" y="280" class="box2" rx="11"/><text x="592" y="306" class="t2">Kev v1.0 · hybrid decoder + pointer head</text><text x="592" y="328" class="s">Qwen3.5-0.8B: 18 Gated DeltaNet + 6 full-attention layers,</text><text x="592" y="346" class="s">LoRA merged; a pointer head reads the option tokens.</text><text x="592" y="370" class="m">noul · choice · score + raw probabilities</text><path d="M200 408 V 444" class="arrow"/><path d="M560 408 V 444" class="arrow"/><path d="M920 408 V 444" class="arrow"/><text x="34" y="438" class="k">BACKENDS</text><rect width="340" height="104" x="30" y="448" class="box" rx="12"/><text x="50" y="478" class="t">WebGPU</text><text x="50" y="502" class="s">WGSL kernels run every transformer layer;</text><text x="50" y="520" class="s">WebAssembly tokenizes and scores.</text><text x="50" y="540" class="m">tens of ms per short request</text><rect width="340" height="104" x="390" y="448" class="box" rx="12"/><text x="410" y="478" class="t">WebAssembly SIMD</text><text x="410" y="502" class="s">relaxed-SIMD, SIMD128 or baseline build,</text><text x="410" y="520" class="s">picked by feature probe; packs under 2 GiB.</text><text x="410" y="540" class="m">no GPU needed</text><rect width="340" height="104" x="750" y="448" class="box" rx="12"/><text x="770" y="478" class="t">Tensor-parallel workers</text><text x="770" y="502" class="s">Laya&apos;s attention heads and FFN split across</text><text x="770" y="520" class="s">N workers, two exchanges per layer.</text><text x="770" y="540" class="m">no SharedArrayBuffer required</text><path d="M560 556 V 588" class="arrow dash"/><rect width="1060" height="50" x="30" y="592" fill="url(#g)" opacity=".1" rx="12"/><rect width="1060" height="50" x="30" y="592" fill="none" stroke="url(#g)" stroke-width="1.4" rx="12"/><text x="52" y="622" class="t2">Your page</text><text x="140" y="622" class="m">await kevala.decide(state, { urgent: { type: &quot;noul&quot;, instructions: &quot;…&quot; } }) → { answers: { urgent: { noul: 0.93 } } }</text></svg>